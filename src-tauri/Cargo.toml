[package]
name = "soffit-commit"
version = "0.1.1"
description = "Soffit Commit — decentralized file sharing with Excel and SQL support"
authors = ["you"]
edition = "2021"

[lib]
name = "soffit_commit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["ws"] }
rusqlite = { version = "0.31", features = ["bundled"] }
argon2 = "0.5"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
base32 = "0.4"
futures-util = "0.3"
tower-http = { version = "0.5", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "1"
once_cell = "1"
tokio-util = { version = "0.7", features = ["io"] }
bytes = "1"

# iroh networking stack
iroh = "1.1.0"
iroh-blobs = "0.103.0"
iroh-gossip = "0.101.0"

# Excel engine
umya-spreadsheet = "3.1.0"

# AI inference engine — in-process, CPU-only, GGUF models
llama-cpp-2 = "0.1"
encoding_rs = "0.8"

# SQL engine - using rusqlite (already bundled) instead of DuckDB
# to avoid the massive C++ compilation that crashes low-RAM machines.
# DuckDB can be re-added later with `features = ["bundled"]` on a beefy build server.

# QR code generation
qrcode = "0.14"
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.22"
sha2 = "0.10"

# HTTP client for model downloads
reqwest = { version = "0.12", features = ["stream"] }

# CSV parsing for SQL file queries
csv = "1"
pdf-extract = "0.7"

# Regex for SQL preprocessing
regex = "1"

# Full-text search - using SQLite FTS5 (already bundled via rusqlite)
# instead of tantivy to keep compile times manageable.

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
